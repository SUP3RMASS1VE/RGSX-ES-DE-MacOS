# macOS-only release workflow for SUP3RMASS1VE/RGSX-ES-DE-MacOS.
# To trigger: git tag v1.X.X && git push origin v1.X.X
name: Release on tag
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build_macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r ports/RGSX/requirements.txt
      - name: Headless smoke test and unit tests
        shell: bash
        env:
          RGSX_HEADLESS: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          python -c "import sys; sys.path.insert(0,'ports/RGSX'); import config, utils; print(config.SAVE_FOLDER)"
          python -m unittest discover -s tests -v
      - name: Build RGSX_macos_arm64.zip
        shell: bash
        run: scripts/build_release_zip.sh dist
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# RGSX for macOS (ES-DE) ${GITHUB_REF_NAME}"
            echo
            echo "## Changelog"
            git log -1 --format=%B "${GITHUB_REF_NAME}"
            echo
            echo "---"
            echo
            echo "## Installation (macOS, Apple Silicon, ES-DE)"
            echo '1. Download `RGSX_macos_arm64.zip` from this release and unzip it'
            echo '2. Move the `ports` folder into your ES-DE ROMs folder (replace any old `ports/RGSX`)'
            echo '3. In ES-DE open Ports > RGSX (first launch downloads about 60 MB, no Homebrew or terminal needed; see README)'
            echo
            echo "## Update"
            echo 'Replace the `ports` folder in your ES-DE ROMs folder with the one from the latest release. Settings and the runtime are kept.'
            echo
            echo "Documentation: [README.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md)"
            echo
            echo "## Credits"
            echo "macOS fork (RGSX-ES-DE-MacOS) of RGSX by RetroGameSets: https://github.com/RetroGameSets/RGSX"
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RGSX macOS ${{ github.ref_name }}
          generate_release_notes: false
          draft: false
          prerelease: false
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/RGSX_macos_arm64.zip
            dist/RGSX_macos_arm64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
